{{- if and .Values.ingress.enabled (eq .Values.ingress.type "traefik") }}
{{- $prefix := .Values.server.staticPrefix }}
{{- $host := .Values.ingress.host }}
{{- $hostRe := replace "." "\\." $host }}
{{- $full := include "mlflow-azure-sso.fullname" . }}
# Homelab routing via Traefik IngressRoutes. The host firewall blocks Traefik's
# native pod-IP load balancing, so an ExternalName service fronts the ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-ext
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ $full }}.{{ .Release.Namespace }}.svc.cluster.local
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $full }}-redirect-https
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- if and $prefix .Values.ingress.traefik.redirectBareHostToPrefix }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $full }}-redirect-prefix
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: ^https?://{{ $hostRe }}(/.*)?$
    replacement: https://{{ $host }}{{ $prefix }}${1}
    permanent: true
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $full }}-web
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ $host }}`)
      kind: Rule
      middlewares:
        - name: {{ $full }}-redirect-https
          namespace: {{ .Release.Namespace }}
      services:
        - name: {{ $full }}-ext
          port: {{ .Values.service.port }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $full }}-websecure
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    {{- if $prefix }}
    - match: Host(`{{ $host }}`) && PathPrefix(`{{ $prefix }}`)
      kind: Rule
      priority: 100
      services:
        - name: {{ $full }}-ext
          port: {{ .Values.service.port }}
    {{- end }}
    # The oidc-auth plugin serves its own routes at the server root (not under
    # the static prefix), so proxy them too.
    - match: >-
        Host(`{{ $host }}`) && (PathPrefix(`/login`) || PathPrefix(`/logout`)
        || PathPrefix(`/callback`) || PathPrefix(`/oidc`) || PathPrefix(`/providers`)
        || PathPrefix(`/auth`) || PathPrefix(`/health`) || PathPrefix(`/saml`)
        || PathPrefix(`/slo`) || PathPrefix(`/scim`))
      kind: Rule
      priority: 90
      services:
        - name: {{ $full }}-ext
          port: {{ .Values.service.port }}
    - match: Host(`{{ $host }}`)
      kind: Rule
      priority: 1
      {{- if and $prefix .Values.ingress.traefik.redirectBareHostToPrefix }}
      middlewares:
        - name: {{ $full }}-redirect-prefix
          namespace: {{ .Release.Namespace }}
      {{- end }}
      services:
        - name: {{ $full }}-ext
          port: {{ .Values.service.port }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
{{- end }}
