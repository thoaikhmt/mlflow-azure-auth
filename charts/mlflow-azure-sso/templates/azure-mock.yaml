{{- if and .Values.azureSso.enabled .Values.azureSso.mock.enabled }}
{{- $tenant := .Values.azureSso.mock.tenantId }}
{{- $host := .Values.azureSso.mock.hostname }}
{{- $full := include "mlflow-azure-sso.fullname" . }}
# Simulated Azure Entra ID (navikt/mock-oauth2-server) so the OIDC SSO flow can
# be exercised without a real tenant. Claims follow Entra ID: `oid` (object id,
# used as the MLflow username), `name`, `upn`/`preferred_username`,
# `given_name`/`family_name`, and `groups` as group *object IDs* (GUIDs).
# The login username (`alice` / `admin` / `carol` / `bob`) selects the claim set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-azure-mock-config
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "interactiveLogin": true,
      "httpServer": "MockWebServerWrapper",
      "tokenCallbacks": [
        {
          "issuerId": "{{ $tenant }}",
          "tokenExpiry": 3600,
          "requestMappings": [
            {
              "requestParam": "subject",
              "match": "alice",
              "claims": {
                "sub": "alice-subject",
                "oid": "44444444-4444-4444-4444-444444444444",
                "tid": "{{ $tenant }}",
                "upn": "alice@contoso.example",
                "preferred_username": "alice@contoso.example",
                "given_name": "Alice",
                "family_name": "Example",
                "name": "Alice Example",
                "groups": ["22222222-2222-2222-2222-222222222222"]
              }
            },
            {
              "requestParam": "subject",
              "match": "admin",
              "claims": {
                "sub": "admin-subject",
                "oid": "55555555-5555-5555-5555-555555555555",
                "tid": "{{ $tenant }}",
                "upn": "admin@contoso.example",
                "preferred_username": "admin@contoso.example",
                "given_name": "Admin",
                "family_name": "Example",
                "name": "Admin Example",
                "groups": [
                  "22222222-2222-2222-2222-222222222222",
                  "33333333-3333-3333-3333-333333333333"
                ]
              }
            },
            {
              "requestParam": "subject",
              "match": "carol",
              "claims": {
                "sub": "carol-subject",
                "oid": "77777777-7777-7777-7777-777777777777",
                "tid": "{{ $tenant }}",
                "upn": "carol@contoso.example",
                "preferred_username": "carol@contoso.example",
                "given_name": "Carol",
                "family_name": "Example",
                "name": "Carol Example",
                "groups": [
                  "88888888-8888-8888-8888-888888888888",
                  "22222222-2222-2222-2222-222222222222"
                ]
              }
            },
            {
              "requestParam": "subject",
              "match": "bob",
              "claims": {
                "sub": "bob-subject",
                "oid": "66666666-6666-6666-6666-666666666666",
                "tid": "{{ $tenant }}",
                "upn": "bob@contoso.example",
                "preferred_username": "bob@contoso.example",
                "given_name": "Bob",
                "family_name": "Example",
                "name": "Bob Example",
                "groups": []
              }
            },
            {
              "requestParam": "subject",
              "match": ".*",
              "claims": {
                "tid": "{{ $tenant }}",
                "groups": []
              }
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-azure-mock
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: azure-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mlflow-azure-sso.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: azure-mock
  template:
    metadata:
      labels:
        {{- include "mlflow-azure-sso.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: azure-mock
    spec:
      containers:
        - name: mock-oauth2-server
          image: {{ .Values.azureSso.mock.image | quote }}
          env:
            - name: JSON_CONFIG_PATH
              value: /config/config.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /isalive, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /isalive, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $full }}-azure-mock-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-azure-mock
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mlflow-azure-sso.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: azure-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if eq .Values.ingress.type "traefik" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-azure-mock-ext
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ $full }}-azure-mock.{{ .Release.Namespace }}.svc.cluster.local
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $full }}-azure-mock-web
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ $host }}`)
      kind: Rule
      middlewares:
        - name: {{ $full }}-redirect-https
          namespace: {{ .Release.Namespace }}
      services:
        - name: {{ $full }}-azure-mock-ext
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $full }}-azure-mock-websecure
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ $host }}`)
      kind: Rule
      services:
        - name: {{ $full }}-azure-mock-ext
          port: 8080
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
{{- end }}
{{- end }}
