apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlflow-azure-sso.fullname" . }}
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mlflow-azure-sso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlflow-azure-sso.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mlflow-azure-sso.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # 1. Wait for PostgreSQL (the chart's original dbchecker behavior).
        - name: dbchecker
          image: busybox:1.38.0
          command: ["sh", "-c"]
          args:
            - |
              echo "[dbchecker] waiting for ${PGHOST}:${PGPORT}..."
              until nc -z -w 2 "${PGHOST}" "${PGPORT}"; do sleep 3; done
              echo "[dbchecker] database OK"
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
        # 2. Create the shared schema (and drop legacy auth tables once) BEFORE
        #    MLflow's migration; inline python, no extra volume.
        - name: init-schema
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              python - <<'PY'
              import os, time
              import psycopg2

              schema = os.environ["PGSCHEMA"]
              version_table = "oidc_alembic_version"
              legacy = (
                  "auth_sessions", "auth_state", "users", "groups", "user_groups",
                  "user_identities", "user_tokens",
                  "experiment_permissions", "experiment_regex_permissions",
                  "experiment_group_permissions", "experiment_group_regex_permissions",
                  "registered_model_permissions", "registered_model_regex_permissions",
                  "registered_model_group_permissions", "registered_model_group_regex_permissions",
                  "scorer_permissions", "scorer_regex_permissions",
                  "scorer_group_permissions", "scorer_group_regex_permissions",
                  "gateway_endpoint_permissions", "gateway_endpoint_regex_permissions",
                  "gateway_endpoint_group_permissions", "gateway_endpoint_group_regex_permissions",
                  "gateway_model_definition_permissions", "gateway_model_definition_regex_permissions",
                  "gateway_model_definition_group_permissions", "gateway_model_definition_group_regex_permissions",
                  "gateway_secret_permissions", "gateway_secret_regex_permissions",
                  "gateway_secret_group_permissions", "gateway_secret_group_regex_permissions",
                  "mcp_server_permissions", "mcp_server_group_permissions",
                  "workspace_permissions", "workspace_regex_permissions",
                  "workspace_group_permissions", "workspace_group_regex_permissions",
                  "workspace_group_rules",
                  "saml_assertions", "scim_activity", "scim_tokens",
                  "roles", "role_permissions", "alembic_version_auth",
              )

              def connect():
                  for _ in range(60):
                      try:
                          return psycopg2.connect(
                              host=os.environ["PGHOST"], port=os.environ["PGPORT"],
                              dbname=os.environ["PGDATABASE"], user=os.environ["PGUSER"],
                              password=os.environ["PGPASSWORD"],
                          )
                      except psycopg2.OperationalError as exc:
                          print("[init-schema] waiting for postgres:", exc)
                          time.sleep(3)
                  raise SystemExit("[init-schema] postgres not reachable")

              conn = connect()
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute("SELECT 1 FROM information_schema.schemata WHERE schema_name = %s", (schema,))
                  if cur.fetchone() is None:
                      cur.execute('CREATE SCHEMA "%s"' % schema)
                      print("[init-schema] created schema", schema)
                  cur.execute("SELECT to_regclass(%s)", (f"{schema}.{version_table}",))
                  if cur.fetchone()[0] is None:
                      for table in legacy:
                          cur.execute('DROP TABLE IF EXISTS "%s"."%s" CASCADE' % (schema, table))
                      print("[init-schema] dropped legacy auth tables (if any)")
              conn.close()
              PY
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mlflow-azure-sso.secretName" . }}
                  key: PG_PASSWORD
            - name: PGSCHEMA
              value: {{ .Values.postgres.schema | quote }}
        # 3. MLflow's own database migration (the chart's original
        #    mlflow-db-migration logic), inline.
        - name: mlflow-db-migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              python - <<'PY'
              from mlflow.store.db import utils

              engine = utils.create_sqlalchemy_engine_with_retry("postgresql://")
              utils._initialize_tables(engine)
              print("[mlflow-db-migration] MLflow tables initialized")
              PY
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mlflow-azure-sso.secretName" . }}
                  key: PG_PASSWORD
        {{- if and .Values.azureSso.enabled .Values.azureSso.mock.enabled }}
        # 4. The plugin registers its OIDC client once at startup; wait for the
        #    simulated Entra ID's public discovery endpoint first.
        - name: wait-for-azure-mock
          image: busybox:1.38.0
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                if wget -q --no-check-certificate -O /dev/null \
                    "https://{{ .Values.azureSso.mock.hostname }}/{{ .Values.azureSso.mock.tenantId }}/.well-known/openid-configuration"; then
                  exit 0
                fi
                sleep 3
              done
              echo "azure mock discovery endpoint not reachable" >&2
              exit 1
        {{- end }}
      containers:
        - name: mlflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["mlflow"]
          args:
            - server
            - --host={{ .Values.server.host }}
            - --port={{ .Values.server.containerPort }}
            - --backend-store-uri=postgresql://
            - --default-artifact-root={{ include "mlflow-azure-sso.artifactRoot" . | trim }}
            {{- if .Values.azureSso.enabled }}
            - --app-name=oidc-auth
            {{- end }}
            - --uvicorn-opts=--log-level={{ .Values.server.logLevel }}
            - --allowed-hosts={{ .Values.server.allowedHosts }}
            {{- if .Values.server.staticPrefix }}
            - --static-prefix={{ .Values.server.staticPrefix }}
            {{- end }}
            - --workers={{ .Values.server.workers }}
          ports:
            - name: {{ .Values.server.portName }}
              containerPort: {{ .Values.server.containerPort }}
          env:
            - name: MLFLOW_FLASK_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mlflow-azure-sso.secretName" . }}
                  key: MLFLOW_FLASK_SERVER_SECRET_KEY
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mlflow-azure-sso.secretName" . }}
                  key: PG_PASSWORD
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.server.forwardedAllowIps | quote }}
            {{- if .Values.artifactRoot.s3.enabled }}
            {{- if .Values.artifactRoot.s3.endpoint }}
            - name: MLFLOW_S3_ENDPOINT_URL
              value: {{ .Values.artifactRoot.s3.endpoint | quote }}
            {{- end }}
            {{- if .Values.artifactRoot.s3.region }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.artifactRoot.s3.region | quote }}
            {{- end }}
            {{- if .Values.artifactRoot.s3.existingSecret.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.artifactRoot.s3.existingSecret.name }}
                  key: {{ .Values.artifactRoot.s3.existingSecret.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.artifactRoot.s3.existingSecret.name }}
                  key: {{ .Values.artifactRoot.s3.existingSecret.secretAccessKeyKey }}
            {{- else if .Values.artifactRoot.s3.accessKeyId }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.artifactRoot.s3.accessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.artifactRoot.s3.secretAccessKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.azureSso.enabled }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mlflow-azure-sso.secretName" . }}
                  key: MLFLOW_FLASK_SERVER_SECRET_KEY
            - name: OIDC_DISCOVERY_URL
              value: {{ .Values.azureSso.discoveryUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.azureSso.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mlflow-azure-sso.secretName" . }}
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.azureSso.redirectUri | quote }}
            - name: OIDC_SCOPE
              value: {{ .Values.azureSso.scope | quote }}
            - name: OIDC_PROVIDER_DISPLAY_NAME
              value: {{ .Values.azureSso.providerDisplayName | quote }}
            - name: OIDC_GROUPS_ATTRIBUTE
              value: {{ .Values.azureSso.groupsAttribute | quote }}
            - name: OIDC_GROUP_NAME
              value: {{ join "," .Values.azureSso.groupName | quote }}
            - name: OIDC_ADMIN_GROUP_NAME
              value: {{ join "," .Values.azureSso.adminGroupName | quote }}
            - name: OIDC_USERNAME_FIELD
              value: {{ .Values.azureSso.usernameField | quote }}
            - name: OIDC_DISPLAY_NAME_FIELD
              value: {{ .Values.azureSso.displayNameField | quote }}
            - name: OIDC_ALEMBIC_VERSION_TABLE
              value: {{ .Values.azureSso.alembicVersionTable | quote }}
            - name: OIDC_VERIFY_SSL
              value: {{ .Values.azureSso.verifySsl | quote }}
            - name: AUTOMATIC_LOGIN_REDIRECT
              value: {{ .Values.azureSso.automaticLoginRedirect | quote }}
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.azureSso.sessionCookieSecure | quote }}
            - name: SESSION_COOKIE_SAMESITE
              value: {{ .Values.azureSso.sessionCookieSamesite | quote }}
            - name: DEFAULT_MLFLOW_PERMISSION
              value: {{ .Values.azureSso.defaultPermission | quote }}
            - name: TRUSTED_PROXIES
              value: {{ join "," .Values.azureSso.trustedProxies | quote }}
            - name: OIDC_USERS_DB_URI
              value: "postgresql+psycopg2://$(PGUSER):$(PGPASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ if .Values.server.staticPrefix }}{{ .Values.server.staticPrefix }}{{ end }}/health
              port: {{ .Values.server.portName }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ if .Values.server.staticPrefix }}{{ .Values.server.staticPrefix }}{{ end }}/health
              port: {{ .Values.server.portName }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
