{{- if and .Values.coredns.enabled .Values.azureSso.enabled .Values.azureSso.mock.enabled }}
# k3s CoreDNS imports /etc/coredns/custom/*.override from the `coredns-custom`
# ConfigMap. A second `hosts` block is rejected ("this plugin can only be used
# once per Server Block"), so use `template` to resolve the mock's public
# hostname to the node VIP (Traefik) for every pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  azure-mock.override: |
    template IN A {{ .Values.azureSso.mock.hostname }} {
      answer "{{ "{{ .Name }}" }} 60 IN A {{ .Values.coredns.targetIp }}"
    }
{{- end }}
