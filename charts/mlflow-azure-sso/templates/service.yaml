apiVersion: v1
kind: Service
metadata:
  name: {{ include "mlflow-azure-sso.fullname" . }}
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mlflow-azure-sso.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.server.portName }}
{{- if .Values.headless.enabled }}
---
# Headless Service so in-cluster clients can reach the pod directly (the host
# firewall drops ClusterIP forwarding).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.headless.name }}
  labels:
    {{- include "mlflow-azure-sso.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mlflow-azure-sso.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.containerPort }}
      targetPort: {{ .Values.server.portName }}
{{- end }}
