# Defaults target AWS EKS: ALB Ingress, external RDS for the backend store,
# external S3 for artifacts. The homelab (Traefik + simulated Entra ID + MinIO)
# is opt-in via an override values file.

replicaCount: 1

image:
  repository: ghcr.io/your-org/mlflow-azure-sso
  tag: v3.16.1-entra
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # EKS IRSA: annotate with the IAM role for S3 access.
  annotations: {}
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/mlflow-s3

# Stable signing key for the Flask session / oidc-auth plugin. Set this
# explicitly (and identically across replicas); rotate via a Secret.
flaskServerSecretKey: ""

server:
  host: "0.0.0.0"
  containerPort: 5000
  portName: mlflow
  # Serve MLflow under a static prefix ('' disables).
  staticPrefix: "/mlflow"
  # MLflow DNS-rebinding guard. Must include the ingress host and the pod CIDR
  # (kubelet probes hit the pod IP; ALB target-type ip also arrives on it).
  allowedHosts: ""
  workers: 1
  logLevel: info
  # Behind an ALB the forwarded headers come from the VPC CIDR.
  forwardedAllowIps: "*"

# External PostgreSQL (e.g. RDS). The role's search_path must be the schema
# below so MLflow and the oidc plugin share it.
postgres:
  host: ""
  port: 5432
  database: mlflow
  user: mlflow
  password: ""
  schema: mlflow

# External S3 (AWS). MinIO / S3-compatible stores: set endpoint.
artifactRoot:
  s3:
    enabled: true
    bucket: ""
    path: ""
    endpoint: ""
    region: ""
    accessKeyId: ""
    secretAccessKey: ""
    # Prefer IRSA (serviceAccount.annotations) or an existing Secret.
    existingSecret:
      name: ""
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

# Azure Entra ID SSO. `enabled: false` runs MLflow with NO authentication
# (no --app-name); `true` adds --app-name=oidc-auth and the OIDC env.
azureSso:
  enabled: true
  discoveryUrl: "https://login.microsoftonline.com/<tenant-id>/v2.0/.well-known/openid-configuration"
  clientId: ""
  clientSecret: ""
  redirectUri: ""
  scope: "openid,email,profile"
  providerDisplayName: "Sign in with Azure Entra ID"
  groupsAttribute: "groups"
  # Entra sends group *object IDs*; a user is admitted if ANY of their groups
  # matches ANY entry here.
  groupName: []
  adminGroupName: []
  defaultPermission: "MANAGE"
  sessionCookieSecure: true
  sessionCookieSamesite: "lax"
  # Entra claim mapping (the plugin persists only username + display_name).
  usernameField: "oid"
  displayNameField: "name"
  # Distinct Alembic version table: the plugin shares MLflow's schema.
  alembicVersionTable: "oidc_alembic_version"
  verifySsl: true
  automaticLoginRedirect: false
  trustedProxies: []
  # Optional Microsoft Graph group-name resolution (needs GroupMember.Read.All).
  groupDetectionPlugin: ""
  # Homelab-only simulated Entra ID (navikt/mock-oauth2-server). Off by default.
  mock:
    enabled: false
    hostname: "azure-mock.localhost"
    tenantId: ""
    image: "ghcr.io/navikt/mock-oauth2-server:6.0.4"

service:
  type: ClusterIP
  port: 80

# Headless service so in-cluster clients can reach the pod directly.
headless:
  enabled: true
  name: mlflow-pods

ingress:
  enabled: true
  # alb | traefik | none
  type: alb
  className: alb
  host: mlflow.example.com
  path: /
  pathType: Prefix
  # ALB (AWS Load Balancer Controller) annotations.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /mlflow/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  tlsSecretName: ""
  certificateArn: ""
  # Traefik-specific (homelab); see templates/ingress-traefik.yaml.
  traefik:
    redirectBareHostToPrefix: true

# Homelab-only: resolve the mock hostname cluster-wide to the node VIP (Traefik)
# via the k3s coredns-custom import.
coredns:
  enabled: false
  targetIp: "10.10.10.10"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# Slow startup (MLflow + plugin OIDC registration); no startupProbe available.
livenessProbe:
  initialDelaySeconds: 90
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 12

nodeSelector: {}
tolerations: []
affinity: {}
