# Build the custom MLflow image (official -full + mlflow-oidc-auth), push it to
# the in-cluster Gitea container registry, then run the Entra ID SSO integration
# test against a simulated Azure service.
name: build-and-test

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: gitea.localhost
  IMAGE: gitea.localhost/gitea_admin/mlflow
  TAG: v3.16.1-entra.3
  # Gitea is served with a self-signed homelab CA the job image does not trust.
  GIT_SSL_NO_VERIFY: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Gitea container registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | docker login "$REGISTRY" \
                --username "${{ secrets.REGISTRY_USERNAME }}" \
                --password-stdin

      - name: Build and push image
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:$TAG-$SHORT_SHA" -f Containerfile .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG-$SHORT_SHA"

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull the pushed image
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | docker login "$REGISTRY" \
                --username "${{ secrets.REGISTRY_USERNAME }}" \
                --password-stdin
          docker pull "$IMAGE:$TAG"

      - name: Run the Azure Entra ID SSO integration test
        env:
          CONTAINER_ENGINE: docker
          # Keep in sync with TAG above so the test runs the exact image built.
          IMAGE: gitea.localhost/gitea_admin/mlflow:v3.16.1-entra.3
        run: ./test/run-integration.sh
