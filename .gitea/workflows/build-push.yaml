# Build the custom MLflow image (official mlflow:v3.16.1-full + the vendored
# mlflow-oidc-auth plugin) and push it to Docker Hub.
#
#   * push to `main`      -> docker.io/thoaikhmt/mlflow-azure-auth:latest
#   * push a `v*` git tag -> docker.io/thoaikhmt/mlflow-azure-auth:<tag>
#                             (first release: v1.0.0)
#
# Every build also gets an immutable `sha-<short>` tag.
#
# The image is built with the daemon's own builder (plain `docker build`, NOT
# `docker buildx` with a docker-container builder) with
# `--provenance=false --sbom=false`, so the pushed manifest is a plain Docker
# schema2 manifest: no OCI index and no `unknown/unknown` attestation. That is
# what pull-through proxies such as Nexus need (an attestation makes them fail
# with "could not fetch content descriptor ... not found"). The daemon builder
# is also required here because BuildKit's separate docker-container builder in
# this homelab cannot reach ghcr.io (TLS handshake timeout) while the daemon can.
name: build-and-push

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: docker.io/thoaikhmt/mlflow-azure-auth
  # The in-cluster Gitea uses a self-signed homelab CA the job image does not trust.
  GIT_SSL_NO_VERIFY: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login docker.io \
                --username "${{ secrets.DOCKERHUB_USERNAME }}" \
                --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          ref="${{ github.ref }}"
          case "$ref" in
            refs/tags/*) tag="${ref#refs/tags/}" ;;
            refs/heads/main) tag="latest" ;;
            *) echo "unsupported ref: ${ref}" >&2; exit 1 ;;
          esac
          short="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "==> pushing ${IMAGE}:${tag} and ${IMAGE}:sha-${short}"
          docker build \
            --file Containerfile \
            --provenance=false \
            --sbom=false \
            --tag "${IMAGE}:${tag}" \
            --tag "${IMAGE}:sha-${short}" \
            .
          docker push "${IMAGE}:${tag}"
          docker push "${IMAGE}:sha-${short}"

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the Azure Entra ID SSO integration test
        env:
          CONTAINER_ENGINE: docker
        run: ./test/run-integration.sh
